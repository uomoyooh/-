<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유호원 · 사진</title>
<meta name="description" content="유호원 사진 작업 포트폴리오">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#141414;--mute:#7c7c7c;--line:#e8e8e8;--side:230px;--sans:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--serif:'Noto Serif KR','Apple myungjo',serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:300 15px/1.8 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ───── 첫 화면 ───── */
.intro{min-height:100vh;padding:40px 48px;display:flex;flex-direction:column}
.intro header b{font-size:19px;font-weight:500;display:block;line-height:1.3}
.intro header small{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.intro header p{margin-top:14px;color:var(--mute);font-size:14px}
.gate{margin:auto 0;padding:48px 0;display:flex;flex-direction:column;gap:.1em}
.gate a{display:flex;align-items:baseline;gap:18px;font-size:clamp(46px,9vw,112px);font-weight:100;line-height:1.15;letter-spacing:-.02em;transition:padding-left .25s,font-weight .25s}
.gate a:hover,.gate a:focus-visible{padding-left:.25em;font-weight:300}
.gate small{font-size:13px;font-weight:300;letter-spacing:0;color:var(--mute)}
.intro footer{display:flex;gap:24px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.intro footer a:hover{color:var(--ink)}

/* ───── 안쪽 페이지: 왼쪽 메뉴 ───── */
aside{position:fixed;inset:0 auto 0 0;width:var(--side);padding:40px 32px;display:flex;flex-direction:column;gap:32px;overflow-y:auto}
.brand{font-size:19px;font-weight:500;line-height:1.3}
.brand small{display:block;font-size:12px;font-weight:300;color:var(--mute);margin-top:4px}
nav{display:flex;flex-direction:column;gap:6px}
nav>a{color:var(--mute);line-height:1.6;transition:color .15s}
nav>a:hover,nav>a.on{color:var(--ink)}
nav>a.on{font-weight:500}
.sub{display:flex;flex-direction:column;gap:3px;margin:0 0 10px 14px;padding-left:12px;border-left:1px solid var(--line)}
.sub a{font-size:13px;color:var(--mute);line-height:1.6}
.sub a:hover,.sub a.on{color:var(--ink)}
.sub a.on{font-weight:500}
.foot{margin-top:auto;font-size:12px;color:var(--mute);display:flex;flex-direction:column}
.foot a:hover{color:var(--ink)}
main{margin-left:var(--side);padding:40px 48px 80px;min-height:100vh}
body.home aside{display:none}
body.home main{margin:0;padding:0}

h1{font-size:22px;font-weight:500;margin-bottom:10px}
h1 small{font-size:13px;font-weight:300;color:var(--mute);margin-left:10px}
.text{max-width:62ch;color:#444;margin-bottom:36px}
.text p+p{margin-top:1em}
.empty{color:var(--mute)}

/* Works: 작업 목록 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f1f1f1}
.tile span{display:block;margin-top:10px;font-size:14px}
.tile em{font-style:normal;color:var(--mute);font-size:12px;margin-left:6px}

/* Works: 작업 하나 */
.rows{display:flex;flex-wrap:wrap;gap:10px}
.rows button{border:0;background:#f1f1f1;cursor:zoom-in;flex:var(--r) 1 calc(var(--r)*250px);line-height:0}
.rows img{width:100%;height:auto;display:block}
.rows i{flex-grow:100000}

/* Texts: 글 목록 / 글 읽기 */
.list{max-width:720px;list-style:none}
.list a{display:block;padding:18px 0;border-top:1px solid var(--line)}
.list li:last-child a{border-bottom:1px solid var(--line)}
.list b{display:block;font-size:17px;font-weight:400;transition:padding-left .2s}
.list a:hover b{padding-left:8px}
.list span{display:block;color:var(--mute);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.essay{max-width:34em}
.essay h1{font-size:26px;line-height:1.45;margin-bottom:40px}
.essay .body{font:400 16px/2.05 var(--serif);word-break:keep-all}
.essay .body p+p{margin-top:1.3em}
.back{display:inline-block;margin-top:56px;color:var(--mute);font-size:13px}
.back:hover{color:var(--ink)}

/* 크게 보기 */
#lb{position:fixed;inset:0;background:#fff;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:56px 70px 24px}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain}
#lb p{margin-top:14px;font-size:13px;color:var(--mute);min-height:1.8em;text-align:center}
#lb button{position:absolute;border:0;background:none;font:300 30px/1 var(--sans);color:var(--ink);cursor:pointer;padding:14px;opacity:.55}
#lb button:hover{opacity:1}
#lb .x{top:10px;right:14px}
#lb .p{left:8px;top:50%}
#lb .n{right:8px;top:50%}

@media(max-width:760px){
 .intro{padding:24px 20px}
 aside{position:static;width:auto;padding:24px 20px 8px;gap:14px}
 nav{flex-direction:row;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
 .sub{flex-basis:100%;order:5;flex-direction:row;flex-wrap:wrap;gap:2px 14px;margin:0;padding:6px 0 0;border:0}
 .foot{display:none}
 main{margin:0;padding:16px 20px 60px;min-height:0}
 #lb{padding:56px 12px 20px}
 #lb .p,#lb .n{top:auto;bottom:6px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<aside>
  <a class="brand" href="#" id="brand"></a>
  <nav id="nav" aria-label="메뉴"></nav>
  <div class="foot" id="foot"></div>
</aside>
<main id="main"></main>

<div id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="x" aria-label="닫기">×</button>
  <button class="p" aria-label="이전 사진">‹</button>
  <img alt="">
  <p></p>
  <button class="n" aria-label="다음 사진">›</button>
</div>

<!-- 작업·글 목록: make_data.py 가 이 파일을 자동으로 만듭니다 -->
<script src="data/works.js"></script>
<script>
const D = window.WORKS || {};
const S = D.site || {};
const CATS = D.categories || [];
const TEXTS = D.texts || [];
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const paras = t => (t || '').split(/\n\s*\n/).filter(Boolean).map(p => `<p>${esc(p).trim().replace(/\n/g,'<br>')}</p>`).join('');
const enc = encodeURIComponent;
const ig = (S.instagram || '').replace('@','');
const contact =
  (S.email ? `<a href="mailto:${esc(S.email)}">${esc(S.email)}</a>` : '') +
  (ig ? `<a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a>` : '');

if (S.name) document.title = `${S.name} · 사진`;
$('#brand').innerHTML = `${esc(S.name || '이름')}${S.name_en ? `<small>${esc(S.name_en)}</small>` : ''}`;
$('#foot').innerHTML = contact;

let current = null;   // 지금 보고 있는 작업 (크게 보기용)

function nav(sec, id){
  const sub = (items, base) => `<div class="sub">${items.map(i =>
    `<a href="#${base}/${enc(i.id)}" class="${i.id === id ? 'on' : ''}">${esc(i.title)}</a>`).join('')}</div>`;
  $('#nav').innerHTML =
    `<a href="#works" class="${sec === 'works' ? 'on' : ''}">Works</a>${sec === 'works' ? sub(CATS, 'works') : ''}` +
    `<a href="#texts" class="${sec === 'texts' ? 'on' : ''}">Texts</a>${sec === 'texts' ? sub(TEXTS, 'texts') : ''}` +
    `<a href="#about" class="${sec === 'about' ? 'on' : ''}">About</a>`;
}

function render(){
  const [sec, id] = location.hash.slice(1).split('/').map(decodeURIComponent);
  const m = $('#main');
  const isHome = !['works','texts','about'].includes(sec);
  document.body.classList.toggle('home', isHome);
  current = null;
  window.scrollTo(0, 0);

  /* 첫 화면 */
  if (isHome){
    m.innerHTML = `<div class="intro">
      <header><b>${esc(S.name || '이름')}</b>${S.name_en ? `<small>${esc(S.name_en)}</small>` : ''}${S.tagline ? `<p>${esc(S.tagline)}</p>` : ''}</header>
      <div class="gate">
        <a href="#works">Works<small>작업 ${CATS.length}</small></a>
        <a href="#texts">Texts<small>글 ${TEXTS.length}</small></a>
        <a href="#about">About<small>소개</small></a>
      </div>
      <footer>${contact}</footer></div>`;
    return;
  }

  nav(sec, id);

  /* Works */
  if (sec === 'works'){
    const cat = CATS.find(c => c.id === id);
    if (cat){
      current = cat;
      m.innerHTML = `<h1>${esc(cat.title)}</h1><div class="text">${paras(cat.text)}</div>
        <div class="rows">${cat.images.map((im, i) =>
          `<button style="--r:${((im.w || 3) / (im.h || 2)).toFixed(3)}" data-i="${i}" aria-label="${esc(im.caption || cat.title + ' ' + (i + 1))}">
            <img src="${esc(im.src)}" ${im.w ? `width="${im.w}" height="${im.h}"` : ''} loading="lazy" alt="${esc(im.caption || cat.title)}"></button>`).join('')}<i></i></div>`;
    } else {
      m.innerHTML = `<h1>Works<small>작업</small></h1>` + (CATS.length
        ? `<div class="tiles">${CATS.map(c =>
            `<a class="tile" href="#works/${enc(c.id)}"><img src="${esc(c.images[0].src)}" loading="lazy" alt=""><span>${esc(c.title)}<em>${c.images.length}</em></span></a>`).join('')}</div>`
        : `<p class="empty">아직 등록된 작업이 없습니다.</p>`);
    }
    return;
  }

  /* Texts: 사진 없이 글만 */
  if (sec === 'texts'){
    const t = TEXTS.find(x => x.id === id);
    if (t){
      m.innerHTML = `<article class="essay"><h1>${esc(t.title)}</h1><div class="body">${paras(t.body)}</div><a class="back" href="#texts">← 글 목록</a></article>`;
    } else {
      m.innerHTML = `<h1>Texts<small>글</small></h1>` + (TEXTS.length
        ? `<ul class="list">${TEXTS.map(x =>
            `<li><a href="#texts/${enc(x.id)}"><b>${esc(x.title)}</b><span>${esc(x.body.replace(/\s+/g, ' ').slice(0, 90))}</span></a></li>`).join('')}</ul>`
        : `<p class="empty">아직 등록된 글이 없습니다.</p>`);
    }
    return;
  }

  /* About */
  m.innerHTML = `<h1>About<small>소개</small></h1><div class="text">${paras(D.about)}</div>`;
}
addEventListener('hashchange', render);
render();

/* 크게 보기 */
const lb = $('#lb'); let idx = 0;
function show(i){
  const list = current.images; idx = (i + list.length) % list.length;
  lb.querySelector('img').src = list[idx].src;
  lb.querySelector('img').alt = list[idx].caption || current.title;
  lb.querySelector('p').textContent = [list[idx].caption, `${idx + 1} / ${list.length}`].filter(Boolean).join('   ');
  [list[(idx + 1) % list.length], list[(idx - 1 + list.length) % list.length]].forEach(n => { new Image().src = n.src; });
}
const open = i => { if (!current) return; show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; lb.querySelector('.x').focus(); };
const close = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };
$('#main').addEventListener('click', e => { const b = e.target.closest('.rows button'); if (b) open(+b.dataset.i); });
lb.querySelector('.x').onclick = close;
lb.querySelector('.p').onclick = () => show(idx - 1);
lb.querySelector('.n').onclick = () => show(idx + 1);
lb.addEventListener('click', e => { if (e.target === lb) close(); });
addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') show(idx - 1);
  if (e.key === 'ArrowRight') show(idx + 1);
});
let x0 = null;
lb.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
lb.addEventListener('touchend', e => { if (x0 === null) return; const d = e.changedTouches[0].clientX - x0; if (Math.abs(d) > 50) show(idx + (d < 0 ? 1 : -1)); x0 = null; });
</script>
</body>
</html>
