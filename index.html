<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 포트폴리오</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebec;--surface:#f6f7f7;--ink:#171a1d;--mute:#5d666d;--line:#c9cfd2;--accent:#2f45e6;--on-accent:#fff;
--disp:"Bricolage Grotesque","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--body:"Noto Serif KR","Apple SD Gothic Neo",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--surface:#1d2124;--ink:#eceff0;--mute:#98a2a9;--line:#32383c;--accent:#8c9bff;--on-accent:#10131a}}
:root[data-theme="dark"]{--bg:#15181a;--surface:#1d2124;--ink:#eceff0;--mute:#98a2a9;--line:#32383c;--accent:#8c9bff;--on-accent:#10131a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7}
header{padding:48px 24px 8px;max-width:1400px;margin:0 auto}
h1{font:700 clamp(2.4rem,8vw,5.5rem)/1 var(--disp);letter-spacing:-.03em;margin:0 0 12px}
.intro{color:var(--mute);max-width:52ch;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar-in{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
button,label.btn{font:500 .95rem var(--disp);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:hover,label.btn:hover{border-color:var(--ink)}
.add{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.add:hover{border-color:var(--accent);filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:14px;align-items:center;font:500 .9rem var(--disp);color:var(--mute)}
input[type=range]{accent-color:var(--accent);width:110px}
main{max-width:1400px;margin:0 auto;padding:24px}
.grid{column-count:var(--cols,4);column-gap:var(--gap,14px)}
.tile{break-inside:avoid;margin:0 0 var(--gap,14px);position:relative;cursor:pointer;display:block;width:100%;padding:0;border:0;border-radius:2px;overflow:hidden;background:var(--surface);text-align:left}
.tile img,.tile .ph{display:block;width:100%;height:auto}
.tile .ph{aspect-ratio:var(--r)}
.tile .no{position:absolute;left:8px;top:8px;font:500 .75rem var(--disp);color:#fff;background:rgba(0,0,0,.45);padding:1px 7px;border-radius:2px;opacity:0;transition:opacity .15s}
.tile:hover .no,.tile:focus-visible .no{opacity:1}
.count{font:500 .9rem var(--disp);color:var(--mute);margin:0 0 16px}
.empty{color:var(--mute);padding:48px 0}
footer{max-width:1400px;margin:0 auto;padding:8px 24px 56px;color:var(--mute);font-size:.9rem}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,12,14,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));color:#eceff0}
.lb.on{display:flex}
.lb .stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.lb .stage>*{max-width:100%;max-height:100%;width:auto;height:auto}
.lb .stage .ph{height:min(72vh,100%);aspect-ratio:var(--r);max-width:92vw}
.lb .cap{font:500 1rem var(--disp);padding-top:14px;text-align:center}
.lb .cap small{display:block;color:#98a2a9;font-weight:400}
.lb button{color:#eceff0;border-color:#4a5258;position:absolute;top:calc(12px + env(safe-area-inset-top,0px))}
.lb .x{right:14px}.lb .p,.lb .n{top:50%;transform:translateY(-50%);border-radius:50%;width:44px;height:44px;padding:0;font-size:1.2rem}
.lb .p{left:10px}.lb .n{right:10px}
@media (max-width:700px){.tools input{width:80px}header{padding-top:32px}}
</style>
</head>
<body>
<header>
  <h1>홍길동<br>사진 작업</h1>
  <p class="intro">2019년부터 도시, 풍경, 사람을 찍어 왔습니다. 시리즈별로 모아 한 화면에서 볼 수 있습니다.</p>
</header>
<div class="bar"><div class="bar-in">
  <div class="tabs" id="tabs" role="group" aria-label="시리즈 필터"></div>
  <div class="tools">
    <label for="size">크기</label><input id="size" type="range" min="1" max="6" value="4" aria-label="한 줄에 보이는 사진 수">
    <label class="btn add" for="file">사진 추가</label>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <button id="theme" type="button" aria-label="테마 바꾸기">테마</button>
  </div>
</div></div>
<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>
<footer>사진을 추가하면 이 브라우저 화면에서만 보입니다. 새로고침하면 사라집니다.</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="x" id="lx" type="button">닫기</button>
  <button class="p" id="lp" type="button" aria-label="이전 사진">‹</button>
  <div class="stage" id="stage"></div>
  <button class="n" id="ln" type="button" aria-label="다음 사진">›</button>
  <div class="cap" id="cap"></div>
</div>

<script>
var SERIES=["전체","도시","풍경","인물","필름"];
var seed=[["새벽 횡단보도","도시",210,.8],["비 온 뒤 골목","도시",230,1.25],["옥상에서","도시",200,1.5],["막차","도시",250,.75],["안개 낀 능선","풍경",150,1.5],["겨울 바다","풍경",190,1.33],["이른 숲","풍경",120,.8],["들판","풍경",80,1.78],["창가의 오후","인물",20,.8],["웃음","인물",340,1],["뒷모습","인물",300,1.25],["시장 사람들","인물",35,1.5],["36번 컷","필름",45,1.33],["빛 샌 필름","필름",12,.75],["여름 골목","필름",60,1.5],["흑백 계단","필름",220,.8]];
var photos=seed.map(function(s){return{t:s[0],s:s[1],h:s[2],r:s[3]}});
var cur="전체",lbIdx=-1,list=[];
var $=function(i){return document.getElementById(i)};
function ph(p){var d=document.createElement("div");d.className="ph";d.style.setProperty("--r",String(p.r));
  d.style.background="linear-gradient(155deg,hsl("+p.h+" 35% 62%),hsl("+(p.h+40)+" 40% 32%))";d.setAttribute("role","img");d.setAttribute("aria-label",p.t);return d}
function media(p){if(p.src){var i=document.createElement("img");i.src=p.src;i.alt=p.t;return i}return ph(p)}
function tabs(){var t=$("tabs");t.innerHTML="";SERIES.forEach(function(n){var b=document.createElement("button");b.type="button";b.textContent=n;
  b.setAttribute("aria-pressed",n===cur);b.onclick=function(){cur=n;render();tabs()};t.appendChild(b)})}
function render(){list=photos.filter(function(p){return cur==="전체"||p.s===cur});var g=$("grid");g.innerHTML="";
  $("count").textContent=list.length+"장";
  if(!list.length){g.innerHTML='<p class="empty">이 시리즈에는 아직 사진이 없습니다. 위의 “사진 추가”로 올려 보세요.</p>';g.style.columnCount=1;return}
  g.style.columnCount="";
  list.forEach(function(p,i){var b=document.createElement("button");b.type="button";b.className="tile";b.setAttribute("aria-label",p.t+" 크게 보기");
    b.appendChild(media(p));var n=document.createElement("span");n.className="no";n.textContent=String(i+1).padStart(2,"0");b.appendChild(n);
    b.onclick=function(){open(i)};g.appendChild(b)})}
function open(i){lbIdx=(i+list.length)%list.length;var p=list[lbIdx];var s=$("stage");s.innerHTML="";s.appendChild(media(p));
  $("cap").innerHTML="";$("cap").appendChild(document.createTextNode(p.t));var sm=document.createElement("small");sm.textContent=p.s+" · "+(lbIdx+1)+" / "+list.length;$("cap").appendChild(sm);
  $("lb").classList.add("on");$("lx").focus()}
function close(){$("lb").classList.remove("on");lbIdx=-1}
$("lx").onclick=close;$("lp").onclick=function(){open(lbIdx-1)};$("ln").onclick=function(){open(lbIdx+1)};
$("lb").onclick=function(e){if(e.target===$("lb")||e.target===$("stage"))close()};
document.addEventListener("keydown",function(e){if(lbIdx<0)return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")open(lbIdx-1);if(e.key==="ArrowRight")open(lbIdx+1)});
$("size").oninput=function(){var v=7-Number(this.value);document.documentElement.style.setProperty("--cols",v);document.documentElement.style.setProperty("--gap",(v>4?8:14)+"px")};
document.documentElement.style.setProperty("--cols",3);
$("size").value=4;
$("file").onchange=function(){var fs=Array.prototype.slice.call(this.files);var left=fs.length;
  fs.forEach(function(f){var u=URL.createObjectURL(f);var im=new Image();im.onload=function(){
    photos.unshift({t:f.name.replace(/\.[^.]+$/,""),s:cur==="전체"?"도시":cur,src:u,r:im.naturalWidth/im.naturalHeight});
    if(--left===0)render()};im.onerror=function(){if(--left===0)render()};im.src=u});this.value=""};
var tm="auto";$("theme").onclick=function(){var dark=matchMedia("(prefers-color-scheme: dark)").matches;
  var now=document.documentElement.getAttribute("data-theme")||(dark?"dark":"light");
  document.documentElement.setAttribute("data-theme",now==="dark"?"light":"dark")};
tabs();render();
</script>
</body>
</html>
